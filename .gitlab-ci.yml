# GitLab CI/CD для деплоя на GitLab Pages
image: alpine:latest

pages:
  stage: deploy
  before_script:
    - apk add --no-cache rsync
  script:
    # Копируем все файлы кроме .git и public
    - rsync -av --exclude='.git' --exclude='public' --exclude='.gitlab-ci.yml' ./ public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
